services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: fund-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: AdminPass123
      APP_USER: fund_app
      APP_USER_PASSWORD: FundApp123
    volumes:
      - oracle-data:/opt/oracle/oradata
volumes:
  oracle-data:
